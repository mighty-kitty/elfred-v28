[project]
name = "elfred-freetodo-adapter"
version = "0.1.0"
description = "HTTP sidecar that maps Elfred ContextEvent into an unmodified FreeTodo instance"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20",
  "pypdf>=5,<7",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10"]

[project.optional-dependencies]
printer = ["pyserial>=3.5,<4"]

[project.scripts]
elfred-freetodo-adapter = "adapter.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adapter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

