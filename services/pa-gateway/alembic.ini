# Alembic configuration for the Elfred PA Gateway (execution book WP-02:
# FastAPI service + database migrations).
#
# The database path comes from PA_GATEWAY_DB (see migrations/env.py), so this file
# deliberately leaves sqlalchemy.url empty. Keep this file ASCII-only: Windows
# configparser reads it with the local codec (GBK here) and non-ASCII breaks it.
[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
